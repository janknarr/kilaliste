<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kita Rotationsliste</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

  <!-- ███████████████████████████████████████████████
       1. FIREBASE CONFIG – ersetze mit deinen Werten
  ████████████████████████████████████████████████ -->
  <!-- ███████████████████████████████████████████████
       2. ADMIN PIN – ändere "1234" zu deinem PIN
  ████████████████████████████████████████████████ -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const ADMIN_PIN = "1234"; // ← deinen PIN hier eintragen

    const firebaseConfig = {
      apiKey:            "AIzaSyDxtYNCCBOfCbGMkINmsziSKc2vFTU0oqI",
      authDomain:        "kila-liste.firebaseapp.com",
      databaseURL:       "https://kila-liste-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "kila-liste",
      storageBucket:     "kila-liste.firebasestorage.app",
      messagingSenderId: "900073467682",
      appId:             "1:900073467682:web:76ea16f22469823e347f7b"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getDatabase(app);
    const listRef = ref(db, "rotationsliste");
    const logRef  = ref(db, "log");

    // ── Admin PIN ─────────────────────────────────────────────────────────────

    function checkPin(callback) {
      const pin = prompt("Admin-PIN eingeben:");
      if (pin === null) return;
      if (pin === ADMIN_PIN) callback();
      else alert("Falscher PIN.");
    }

    // ── Save & log ────────────────────────────────────────────────────────────

    function savePeople(people) { set(listRef, people); }

    function logAction(action, previousState) {
      push(logRef, {
        action,
        previousState: JSON.stringify(previousState),
        timestamp: Date.now()
      });
    }

    // ── Freeze logic ──────────────────────────────────────────────────────────
    //
    // List is split into two virtual groups:
    //   - active:  not frozen, rotate normally
    //   - frozen:  joker used, stay in place
    //
    // Visual order: active people first (in their rotation order),
    // then frozen people (in their original order).
    //
    // When person at position 1 checks off → they move to end of active group.
    // If after any reshuffle a frozen person is at position 1 of the FULL list
    // → all frozen people unfreeze.

    function unfreezeIfNeeded(people) {
      if (people.length === 0) return;
      if (people[0].frozen) {
        people.forEach(p => { p.frozen = false; });
      }
    }

    function sortedList(people) {
      // Active first (preserve order), frozen after (preserve order)
      const active = people.filter(p => !p.frozen);
      const frozen = people.filter(p => p.frozen);
      return [...active, ...frozen];
    }

    // ── Actions ───────────────────────────────────────────────────────────────

    // ── House checkbox: toggle "stayed home today" ───────────────────────────

    function toggleHome(people, idx) {
      people[idx].home = !people[idx].home;
      savePeople(people);
    }

    // ── Commit day: called when "Tag abschließen" is pressed ─────────────────
    // - All people with home=true move to end of active list (volunteers get 👏)
    // - Frozen people unfreeze
    // - home flags reset

    function commitDay(people) {
      const homePeople = people.filter(p => p.home && !p.frozen);
      if (homePeople.length === 0 && !people.some(p => p.frozen)) {
        alert("Niemand ist als 'zu Hause' markiert.");
        return;
      }
      if (!confirm("Tag abschließen? Alle markierten Personen rutschen ans Ende.")) return;

      const prev = JSON.parse(JSON.stringify(people));

      const logParts = [];

      // Unfreeze all frozen, deduct joker
      const frozenNames = people.filter(p => p.frozen).map(p => p.name);
      if (frozenNames.length) {
        people.forEach(p => {
          if (p.frozen) {
            p.jokers = Math.max((p.jokers || 0) - 1, 0);
            p.frozen = false;
          }
        });
        logParts.push(`Joker eingesetzt: ${frozenNames.join(", ")}`);
      }

      // Move home people to end
      const homeIndices = people
        .map((p, i) => ({ p, i }))
        .filter(({ p }) => p.home)
        .map(({ i }) => i)
        .reverse();

      const moved = [];
      homeIndices.forEach(i => {
        const [person] = people.splice(i, 1);
        moved.unshift(person);
      });

      const firstActiveOriginal = prev.find(p => !p.frozen);
      moved.forEach(person => {
        const wasFirst = firstActiveOriginal && firstActiveOriginal.name === person.name;
        const isStar = person.home === "star";
        person.home = false;
        if (isStar && !wasFirst) {
          person.stars = (person.stars || 0) + 1;
          logParts.push(`⭐ ${person.name} eingesprungen (${person.stars}×)`);
        } else if (wasFirst) {
          logParts.push(`${person.name} hat Slot übernommen`);
        } else {
          logParts.push(`${person.name} zu Hause geblieben`);
        }
        people.push(person);
      });

      unfreezeIfNeeded(people);
      savePeople(people);
      logAction("Tag abgeschlossen: " + logParts.join(" · "), prev);
    }

    function useJoker(people, idx) {
      if (people[idx].jokers <= 0) return;
      const prev = JSON.parse(JSON.stringify(people));
      const personName = people[idx].name;
      people[idx].jokers -= 1;
      people[idx].frozen = true;
      // Re-sort: active first, frozen after
      const reordered = sortedList(people);
      people.length = 0;
      reordered.forEach(p => people.push(p));
      unfreezeIfNeeded(people);
      savePeople(people);
      logAction(`${personName} hat Joker eingesetzt → eingefroren (${people.find(p=>p.name===personName)?.jokers ?? '?'} Joker übrig)`, prev);
    }

    function removePerson(people, idx) {
      checkPin(() => {
        if (!confirm(`"${people[idx].name}" wirklich entfernen?`)) return;
        const prev = JSON.parse(JSON.stringify(people));
        const personName = people[idx].name;
        people.splice(idx, 1);
        unfreezeIfNeeded(people);
        savePeople(people);
        logAction(`${personName} wurde entfernt`, prev);
      });
    }

    function addPerson(people) {
      const input = document.getElementById("new-name");
      const name = input.value.trim();
      if (!name) return;
      const prev = JSON.parse(JSON.stringify(people));
      // Add before frozen people
      const newPerson = { name, jokers: 1, frozen: false };
      const firstFrozenIdx = people.findIndex(p => p.frozen);
      if (firstFrozenIdx === -1) {
        people.push(newPerson);
      } else {
        people.splice(firstFrozenIdx, 0, newPerson);
      }
      savePeople(people);
      logAction(`${name} wurde hinzugefügt (1 Joker)`, prev);
      input.value = "";
      input.focus();
    }

    function resetJokers(people) {
      checkPin(() => {
        if (!confirm("Allen Personen +1 Joker gutschreiben (max. 2)?")) return;
        const prev = JSON.parse(JSON.stringify(people));
        people.forEach(p => { p.jokers = Math.min((p.jokers || 0) + 1, 2); });
        savePeople(people);
        logAction("Halbjahres-Reset: alle haben +1 Joker erhalten (max. 2)", prev);
      });
    }

    function undoAction(previousStateStr) {
      if (!confirm("Letzte Änderung rückgängig machen?")) return;
      const prev = JSON.parse(previousStateStr);
      savePeople(prev);
      logAction("↩ Rückgängig gemacht", prev);
    }

    // ── Render list ───────────────────────────────────────────────────────────

    function renderList(people) {
      const ul = document.getElementById("list");
      ul.innerHTML = "";

      if (!people.length) {
        ul.innerHTML = `<li class="empty">Noch niemand auf der Liste.</li>`;
        return;
      }

      const firstActive = people.find(p => !p.frozen);

      people.forEach((person, idx) => {
        const isNext = person === firstActive;
        const isFrozen = !!person.frozen;

        const li = document.createElement("li");
        li.className = "person-row"
          + (isNext ? " next-up" : "")
;

        // Three mutually exclusive options: home, star, joker
        // Selection stored in person.selection: false | "home" | "star" | "joker"
        const checkboxGroup = document.createElement("div");
        checkboxGroup.className = "checkbox-group";

        function setSelection(val) {
          people[idx].home = (val === "home" || val === "star") ? val : false;
          people[idx].frozen = val === "joker";
          if (val !== "joker" && val !== people[idx].home) {
            // restore joker count if unselecting joker
          }
          savePeople(people);
        }

        const currentSel = isFrozen ? "joker" : (person.home || false);

        // 🏠 home
        const homeIcon = document.createElement("span");
        homeIcon.className = "cb-icon";
        homeIcon.textContent = "🏠";

        const homeWrap = document.createElement("label");
        homeWrap.className = "check-wrap";
        homeWrap.title = "Kind bleibt zu Hause";
        const homeCb = document.createElement("input");
        homeCb.type = "checkbox"; homeCb.className = "visually-hidden";
        homeCb.checked = currentSel === "home";
        homeCb.onchange = () => {
          setSelection(homeCb.checked ? "home" : false);
        };
        const homeBox = document.createElement("span");
        homeBox.className = "custom-check";
        homeWrap.appendChild(homeCb);
        homeWrap.appendChild(homeBox);

        // ⭐🏠 star
        const starIcon = document.createElement("span");
        starIcon.className = "cb-icon";
        starIcon.textContent = "⭐🏠";

        const starWrap = document.createElement("label");
        starWrap.className = "check-wrap";
        starWrap.title = "Kind zu Hause + eingesprungen";
        const starCb = document.createElement("input");
        starCb.type = "checkbox"; starCb.className = "visually-hidden";
        starCb.checked = currentSel === "star";
        starCb.disabled = (idx === 0 && !isFrozen);
        starCb.onchange = () => {
          setSelection(starCb.checked ? "star" : false);
        };
        const starBox = document.createElement("span");
        starBox.className = "custom-check";
        starWrap.appendChild(starCb);
        starWrap.appendChild(starBox);

        checkboxGroup.appendChild(homeIcon);
        checkboxGroup.appendChild(homeWrap);
        checkboxGroup.appendChild(starIcon);
        checkboxGroup.appendChild(starWrap);

        // Badge
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = idx + 1;

        // Name
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = person.name;
        if (isNext) {
          const tag = document.createElement("span");
          tag.className = "next-tag";
          tag.textContent = "dran";
          name.appendChild(tag);
        }


        // joker pips removed
        const jokers = document.createElement("span");
        jokers.className = "jokers";

        // Star icons (earned by volunteering)
        const applause = document.createElement("span");
        applause.className = "applause";
        if (person.stars && person.stars > 0) {
          applause.title = `${person.stars}× eingesprungen`;
          const count = person.stars;
          applause.textContent = "⭐".repeat(Math.min(count, 5));
          if (count > 5) {
            const sup = document.createElement("sup");
            sup.className = "applause-count";
            sup.textContent = `×${count}`;
            applause.appendChild(sup);
          }
        }

        // Joker checkbox
        const jokerWrap = document.createElement("label");
        jokerWrap.className = "check-wrap";
        jokerWrap.title = "Joker einsetzen: einfrieren";

        const jokerCb = document.createElement("input");
        jokerCb.type = "checkbox";
        jokerCb.className = "visually-hidden";
        jokerCb.disabled = person.jokers <= 0;
        jokerCb.checked = isFrozen;
        jokerCb.onchange = () => {
          if (jokerCb.checked) {
            people[idx].home = false;
            people[idx].frozen = true;
            savePeople(people);
          } else {
            people[idx].frozen = false;
            savePeople(people);
          }
        };

        const jokerBox = document.createElement("span");
        jokerBox.className = "custom-check joker-check" + (isFrozen ? " is-frozen" : "");

        const jokerIcon = document.createElement("span");
        jokerIcon.className = "joker-label";
        jokerIcon.textContent = "Joker nutzen";

        jokerWrap.appendChild(jokerCb);
        jokerWrap.appendChild(jokerBox);

        const jokerBtn = jokerWrap; // alias for appendChild below

        // Remove
        const removeBtn = document.createElement("button");
        removeBtn.className = "btn btn-remove";
        removeBtn.title = "Person entfernen (Admin)";
        removeBtn.textContent = "×";
        removeBtn.onclick = () => removePerson(people, idx);

        li.appendChild(checkboxGroup);
        li.appendChild(badge);
        li.appendChild(name);
        li.appendChild(jokers);
        li.appendChild(applause);
        if (person.jokers > 0 || isFrozen) {
          li.appendChild(jokerIcon);
          li.appendChild(jokerBtn);
        }
        li.appendChild(removeBtn);
        ul.appendChild(li);
      });
    }

    // ── Render log ────────────────────────────────────────────────────────────

    function renderLog(entries) {
      const container = document.getElementById("log-entries");
      container.innerHTML = "";

      if (!entries.length) {
        container.innerHTML = `<p class="log-empty">Noch keine Änderungen.</p>`;
        return;
      }

      const sorted = [...entries].reverse().slice(0, 10);

      sorted.forEach((entry, idx) => {
        const row = document.createElement("div");
        row.className = "log-row";

        const time = new Date(entry.timestamp);
        const timeStr = time.toLocaleDateString("de-DE", { day:"2-digit", month:"2-digit" })
          + " · " + time.toLocaleTimeString("de-DE", { hour:"2-digit", minute:"2-digit" });

        const left = document.createElement("span");
        left.className = "log-text";
        left.innerHTML = `<span class="log-time">${timeStr}</span> ${entry.action}`;
        row.appendChild(left);

        if (idx === 0 && entry.previousState) {
          const undoBtn = document.createElement("button");
          undoBtn.className = "btn btn-undo";
          undoBtn.textContent = "↩ Rückgängig";
          undoBtn.onclick = () => undoAction(entry.previousState);
          row.appendChild(undoBtn);
        }

        container.appendChild(row);
      });
    }

    // ── Firebase listeners ────────────────────────────────────────────────────

    let currentPeople = [];

    onValue(listRef, (snapshot) => {
      currentPeople = snapshot.val() || [];
      renderList(currentPeople);
    });

    onValue(logRef, (snapshot) => {
      const raw = snapshot.val();
      const entries = raw ? Object.values(raw) : [];
      renderLog(entries);
    });

    // ── UI wiring ─────────────────────────────────────────────────────────────

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("add-btn").onclick = () => addPerson(currentPeople);
      document.getElementById("new-name").addEventListener("keydown", (e) => {
        if (e.key === "Enter") addPerson(currentPeople);
      });
      document.getElementById("reset-btn").onclick = () => resetJokers(currentPeople);
      document.getElementById("commit-btn").onclick = () => commitDay(currentPeople);
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #fafff0; }

    :root {
      --bg:      #fafff0;
      --surface: #ffffff;
      --ink:     #0a0a0a;
      --muted:   #444433;
      --accent:  #6600aa;
      --active:  #6600aa;
      --frozen:  #0055ff;
      --border:  #0a0a0a;
      --radius:  10px;
    }

    body {
      background: #fafff0;
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      max-width: 560px;
      margin: 0 auto 2.5rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      flex-shrink: 0;
      margin-top: .25rem;
    }

    .header-left h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 900;
      line-height: 1;
      color: #6600aa;
      letter-spacing: -.02em;
    }

    .header-left h1 span { color: #6600aa; }

    .subtitle {
      margin-top: .5rem;
    }

    .subtitle-lead {
      font-size: 1.05rem;
      font-weight: 900;
      color: #0a0a0a;
      margin-bottom: .4rem;
      padding-left: 0;
    }

    .subtitle-list {
      list-style: none;
      padding: 0 0 0 .75rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }

    .subtitle-list li {
      font-size: .88rem;
      color: #444433;
      padding-left: 1.2rem;
      position: relative;
      line-height: 1.5;
    }

    .subtitle-list li::before {
      content: "→";
      position: absolute;
      left: 0;
      color: #6600aa;
      font-weight: 700;
    }




    .btn-reset {
      background: #f4ff6e;
      color: #0a0a0a;
      border: 2px solid #0a0a0a;
      border-radius: 999px;
      padding: .5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
      box-shadow: 3px 3px 0 #0a0a0a;
      transition: transform .1s, box-shadow .1s;
    }

    .btn-reset:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #0a0a0a;
    }

    .btn-commit {
      background: #0a0a0a;
      color: #fafff0;
      border: 2px solid #0a0a0a;
      border-radius: 999px;
      padding: .5rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
      box-shadow: 3px 3px 0 #6600aa;
      transition: transform .1s, box-shadow .1s;
    }

    .btn-commit:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #6600aa;
    }

    .person-row.frozen {
      border-color: #aaaaaa;
      background: #e8e8e8;
      box-shadow: 3px 3px 0 #aaaaaa;
    }

    .person-row.frozen .name {
      color: #666666;
    }

    .person-row.frozen .badge {
      background: #aaaaaa;
      color: #fff;
    }

    /* ── List ───────────────────────────────────────── */

    #list {
      list-style: none;
      max-width: 560px;
      margin: 0 auto 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }

    .person-row {
      background: var(--surface);
      border: 2px solid #0a0a0a;
      border-radius: var(--radius);
      padding: .7rem .9rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      box-shadow: 3px 3px 0 #0a0a0a;
      transition: box-shadow .15s, transform .15s;
    }

    .person-row:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #0a0a0a;
    }

    .person-row.next-up {
      border-color: #6600aa;
      background: #f3e8ff;
      box-shadow: 3px 3px 0 #6600aa;
    }



    .empty {
      text-align: center;
      color: #0a0a0a;
      padding: 2rem;
      font-size: .85rem;
    }

    /* ── Checkbox ───────────────────────────────────── */

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0);
    }

    .check-wrap { cursor: pointer; flex-shrink: 0; }

    .custom-check {
      width: 26px; height: 26px;
      border-radius: 7px;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafff0;
      transition: background .15s, border-color .15s;
      color: transparent;
    }

    .custom-check svg { width: 12px; height: 10px; }

    input:checked + .custom-check {
      background: #ffffff;
      border-color: #0a0a0a;
    }

    input:checked + .custom-check::after {
      content: "";
      display: block;
      width: 9px;
      height: 6px;
      border-left: 2.5px solid #0a0a0a;
      border-bottom: 2.5px solid #0a0a0a;
      transform: rotate(-45deg) translate(1px, -1px);
    }

    .check-wrap:hover .custom-check:not(.frozen-check) { border-color: var(--active); }

    



    .snowflake { font-size: .85rem; line-height: 1; }

    .house-icon { font-size: .85rem; line-height: 1; }

    .checkbox-group {
      display: flex;
      gap: .25rem;
      flex-shrink: 0;
      align-items: center;
    }

    .check-wrap {
      display: flex;
      align-items: center;
    }

    .cb-icon {
      font-size: .95rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .custom-check.checked-home {
      background: #c8ffb0;
      border-color: #0a0a0a;
    }

    .custom-check.checked-star {
      background: #fff3a0;
      border-color: #0a0a0a;
    }

    

    /* ── Commit row ─────────────────────────────────── */



    /* ── Badge & name ───────────────────────────────── */

    .badge {
      width: 1.6rem; height: 1.6rem;
      border-radius: 50%;
      background: #e0e0d8;
      color: #0a0a0a;
      font-size: .72rem;
      font-weight: 600;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .next-up .badge { background: var(--active); color: #fff; }


    .name {
      flex: 1;
      font-weight: 500;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .next-tag {
      font-size: .68rem;
      font-weight: 600;
      background: color-mix(in srgb, var(--active) 12%, transparent);
      color: var(--active);
      padding: .15rem .45rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .frozen-tag {
      font-size: .68rem;
      font-weight: 600;
      background: color-mix(in srgb, var(--frozen) 12%, transparent);
      color: var(--frozen);
      padding: .15rem .45rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    /* ── Jokers ─────────────────────────────────────── */

    .jokers { display: flex; gap: .2rem; font-size: 1.2rem; }
    .joker-pip { opacity: .2; line-height: 1; filter: grayscale(1); }
    .joker-pip.filled { opacity: 1; filter: none; }

    .applause {
      font-size: .6rem;
      line-height: 1;
      letter-spacing: -.05em;
      opacity: .85;
    }

    .applause-count {
      font-family: 'DM Sans', sans-serif;
      font-size: .65rem;
      font-weight: 700;
      color: #6600aa;
      vertical-align: super;
      margin-left: .1rem;
    }

    /* ── Buttons ────────────────────────────────────── */

    .btn {
      border: none;
      border-radius: 6px;
      padding: .3rem .6rem;
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      flex-shrink: 0;
    }

    .btn:active { transform: scale(.95); }
    .btn:disabled { opacity: .25; cursor: not-allowed; }
    .btn-joker { display: none; } /* replaced by checkbox */

    .joker-label {
      font-size: .75rem;
      font-weight: 600;
      color: #0a0a0a;
      white-space: nowrap;
    }

    .joker-check {
      background: #ffffff;
    }



    input:checked + .joker-check {
      background: #f4ff6e;
      border-color: #0a0a0a;
    }

    .btn-remove {
      background: transparent;
      color: #0a0a0a;
      font-size: .85rem;
      padding: .2rem .5rem;
    }

    .btn-remove:hover { color: #6600aa; }

    /* ── Add row ────────────────────────────────────── */

    .add-row {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: .5rem;
    }

    .add-row input {
      flex: 1;
      border: 2px solid #0a0a0a;
      border-radius: var(--radius);
      padding: .6rem .9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.2rem;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color .15s;
    }

    .add-row input:focus { border-color: #6600aa; box-shadow: 2px 2px 0 #0a0a0a; }
    .add-row input::placeholder { color: var(--muted); }

    .add-row button {
      background: #6600aa;
      color: #fff;
      border: 2px solid #0a0a0a;
      border-radius: var(--radius);
      padding: .6rem 1.1rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 #0a0a0a;
      transition: box-shadow .1s, transform .1s;
    }

    .add-row button:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 #0a0a0a;
    }

    /* ── Log ────────────────────────────────────────── */

    .log-section {
      max-width: 560px;
      margin: 2.5rem auto 0;
    }

    .log-header {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.3rem;
      color: #6600aa;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .log-header span {
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      color: #0a0a0a;
      font-weight: 400;
    }

    .log-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .55rem .75rem;
      border-radius: 8px;
      font-size: .82rem;
      background: var(--surface);
      border: 2px solid #0a0a0a;
      margin-bottom: .35rem;
    }

    .log-row:first-child {
      border-color: #6600aa;
      background: #f3e8ff;
    }

    .log-text { flex: 1; line-height: 1.4; }

    .log-time {
      color: #0a0a0a;
      font-size: .75rem;
      margin-right: .4rem;
    }

    .log-empty {
      color: #0a0a0a;
      font-size: .82rem;
      padding: .5rem 0;
    }

    .btn-undo {
      background: #f3e8ff;
      color: #6600aa;
      white-space: nowrap;
      padding: .25rem .6rem;
      font-size: .72rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>Kita <span>Rotation</span></h1>
      <div class="subtitle">
        <p class="subtitle-lead">Wer ist dran? Live für alle:</p>
        <ul class="subtitle-list">
          <li>Absprechen und heldenhaft aufrücken</li>
          <li>1× Joker ziehen wenn es gar nicht geht</li>
          <li>Update klicken wenn alles eingetragen ist für den Tag</li>
        </ul>
      </div>
    </div>
    <div class="header-right">
      <button class="btn-reset" id="reset-btn">Joker Halbjahres-Reset</button>
      <button class="btn-commit" id="commit-btn">✓  Liste updaten</button>
    </div>
  </header>

  <ul id="list">
    <li class="empty">Firebase verbinden um loszulegen…</li>
  </ul>

  <div class="add-row">
    <input id="new-name" type="text" placeholder="Name hinzufügen…" />
    <button id="add-btn">+ Hinzufügen</button>
  </div>

  <div class="log-section">
    <div class="log-header">
      Änderungsprotokoll <span>max. 10 Einträge · neueste zuerst</span>
    </div>
    <div id="log-entries"></div>
  </div>

</body>
</html>
